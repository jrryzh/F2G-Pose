model:
  NAME: F2GPose
  num_query: 512
  num_points: 8192
  center_num:
  - 512
  - 128
  global_feature_dim: 1024
  encoder_type: graph
  decoder_type: fc
  radio_encoder_type: radio_v2.5-l
  encoder_config:
    embed_dim: 512
    depth: 8
    num_heads: 8
    k: 8
    n_group: 2
    mlp_ratio: 2.0
    block_style_list:
    - attn-graph
    - attn
    - attn
    - attn
    - attn
    - attn
    - attn
    - attn
    combine_style: concat
    num_experts: 8
    top_k: 2
    use_moe: true
  use_aux_loss: true
  aux_loss_weight: 0.01
optimizer:
  type: AdamW
  kwargs:
    lr: 0.0001
    weight_decay: 0.0005
scheduler:
  type: LambdaLR
  kwargs:
    decay_step: 8
    lr_decay: 0.9
    lowest_decay: 0.02
bnmscheduler:
  type: Lambda
  kwargs:
    decay_step: 3
    bn_decay: 0.5
    bn_momentum: 0.9
    lowest_decay: 0.01
max_epoch: 100
total_bs: 512
image_size: 336
input_points: 1024
shape_points: 2048
